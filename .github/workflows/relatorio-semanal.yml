name: Relatório semanal

on:
  schedule:
    # toda segunda às 12:00 UTC (09:00 em Brasília). A ANP costuma publicar a semana na sexta/sábado.
    - cron: "0 12 * * 1"
  workflow_dispatch: {}   # botão "Run workflow" para rodar na hora
  push:
    paths: ["src/**", "main.py", "tests/**", "requirements.txt"]

permissions:
  contents: write

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: pytest -q

  relatorio:
    needs: testes
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Gerar relatório
        env:
          # opcional: sem esse secret o resumo é gerado por regras, sem IA
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python main.py --semanas 12

      - name: Salvar no repositório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/
          git diff --cached --quiet && echo "Sem mudanças" && exit 0
          git commit -m "Relatório da semana $(ls reports | grep -v ultimo | sort | tail -1)"
          git push
